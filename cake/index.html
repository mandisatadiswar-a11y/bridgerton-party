<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandisa's Digital Ball — Cake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Sloop+Script+One&family=Symphony&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="scene">
      <div class="parchment-card cake-card">
        <div class="title-group">
          <h2>Care for a Slice?</h2>
          <p>🎂 A sweet moment of celebration 🎂</p>
        </div>
        <div class="cake-graphic">
          <div class="cake-layer"></div>
          <div class="cake-layer"></div>
          <div class="cake-layer"></div>
          <div class="candle"></div>
        </div>
        <p class="cake-message">
          Thank you for joining us on this magnificent evening. Your wishes and presence have made this celebration truly unforgettable.
        </p>
        <button class="btn gold-btn" id="closing-btn">Bid Adieu</button>
      </div>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
