<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandisa's Digital Ball — Closing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Sloop+Script+One&family=Symphony&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="scene closing-scene">
      <div class="closing-message">
        <h1>Until Next Time</h1>
        <p>Thank you for a most enchanting evening.</p>
        <p>Yours in celebration,<br><em>Mandisa</em></p>
      </div>
    </div>

    <video id="closing-audio" autoplay style="display:none;">
      <source src="../assets/audio/closing.mp4" type="video/mp4" />
    </video>

    <script src="../script.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const closingAudio = document.getElementById('closing-audio');
        if (closingAudio) {
          closingAudio.muted = false;
          closingAudio.play().catch(() => {
            // If autoplay is blocked, require user interaction
            document.body.addEventListener('click', () => {
              closingAudio.play().catch(() => {});
            }, { once: true });
          });
        }
      });
    </script>
  </body>
</html>
